# JitPack build for the PetalNet fork (consumed as com.github.PetalNet:umldoclet:<commit>).
# Tests run in CI; JitPack only needs the shaded doclet jar.
# The Maven wrapper's only-script mode fails on JitPack's image, so install Maven via SDKMAN instead.
jdk:
  - openjdk21
before_install:
  - sdk install maven 3.9.11
  - sdk use maven 3.9.11
install:
  - mvn -B install -DskipTests -Dmaven.javadoc.skip=true -DskipLicenseCheck
